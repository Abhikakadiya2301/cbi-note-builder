<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBI Returned Visits Book Off Template</title>
<link rel="stylesheet" href="assets/css/global.css">
<style>
  :root {
    --accent: var(--returned);
    --accent-dark: var(--returned-dark);
    --accent-soft: var(--returned-soft);
    --focus: var(--returned-focus);
  }
</style>
  <script src="assets/js/privacy-banner.js"></script>
</head>
<body>

<header class="app-header">
  <span class="mark" aria-hidden="true"></span>
  <div>
    <h1>Returned Visits Book Off</h1>
    <div class="sub">Visits returned due to a staff book off</div>
  </div>
  <a class="back" href="index.html">&larr; All templates</a>
</header>

<main>
  <form id="returnedVisitsForm" autocomplete="off">
    <!-- Step 01: Visit Details -->
    <section class="card">
      <div class="eyebrow">
        <span class="num">01</span>
        <h2>Visit Details</h2>
      </div>
      <div class="field-grid">
        <div class="field full">
          <label for="visitDate">Date</label>
          <input type="date" id="visitDate">
        </div>
        <div class="field full">
          <label for="staffName">Staff Name</label>
          <input type="text" id="staffName" placeholder="e.g., John Smith">
        </div>
        <div class="field">
          <label for="numVisits">Number of visits returned</label>
          <input type="number" id="numVisits" min="0" placeholder="0">
        </div>
        <div class="field">
          <label>Total hours returned</label>
          <div class="hours-row">
            <input type="number" id="hoursReturned" min="0" placeholder="Hrs">
            <input type="number" id="minutesReturned" min="0" max="59" placeholder="Mins">
          </div>
        </div>
      </div>
    </section>

    <!-- Step 02: Reason & Description -->
    <section class="card">
      <div class="eyebrow">
        <span class="num">02</span>
        <h2>Reason</h2>
      </div>
      <div class="field-grid">
        <div class="field full">
          <label for="keyword">Keyword / Reason</label>
          <select id="keyword">
            <option value="">[Select Keyword]</option>
            <option value="Illness – self">Illness – self</option>
            <option value="Illness – family">Illness – family</option>
            <option value="Automotive issue">Automotive issue</option>
            <option value="WCB/WSIB/Injury">WCB/WSIB/Injury</option>
            <option value="Modified duties">Modified duties</option>
            <option value="Childcare">Childcare</option>
            <option value="Scheduling error – availability">Scheduling error – availability</option>
            <option value="Scheduling error – distance">Scheduling error – distance</option>
            <option value="Scheduling error – overlapping">Scheduling error – overlapping</option>
            <option value="Education/Student">Education/Student</option>
            <option value="Notice not provided/client not accepted">Notice not provided/client not accepted</option>
            <option value="Bereavement">Bereavement</option>
            <option value="Personal/Family emergency">Personal/Family emergency</option>
            <option value="No show">No show</option>
            <option value="Appointment">Appointment</option>
            <option value="Insufficient hours">Insufficient hours</option>
            <option value="Unapproved removal">Unapproved removal</option>
            <option value="Client-Specific Removal – Environmental Concern">Client-Specific Removal – Environmental Concern</option>
          </select>
        </div>
        <div class="field full">
          <label for="clients">Client(s) Affected</label>
          <input type="text" id="clients" placeholder="List client names or IDs">
        </div>
        <div class="field full">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Provide additional context (e.g., client has dogs, staff has severe allergy)..."></textarea>
        </div>
      </div>
    </section>
  </form>

  <!-- Output Engine -->
  <div class="output-col">
    <div class="output-panel">
      <div class="eyebrow">
        <span class="num">OUT</span>
        <h2>Generated Notes</h2>
      </div>

      <div class="textarea-group">
        <label for="noteOutput">Procura Note</label>
        <textarea id="noteOutput" readonly></textarea>
      </div>

      <div class="textarea-group">
        <label for="teamsOutput">Teams Message</label>
        <textarea id="teamsOutput" readonly></textarea>
      </div>

      <div class="btn-row">
        <button type="button" class="btn-primary" id="copyNoteBtn">Copy Note</button>
        <button type="button" class="btn-secondary" id="copyTeamsBtn">Copy Teams MSG</button>
      </div>
      <div id="copyFeedback" class="copy-feedback">Copied to clipboard!</div>
    </div>
  </div>
</main>

<footer>CBI Returned Visits Book Off Template Builder — data stays in your browser; nothing is transmitted or stored.</footer>
<script src="assets/js/utils.js"></script>
<script src="assets/js/templates.js"></script>
</body>
</html>
